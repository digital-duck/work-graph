# Area pack: graphware design lifecycle (software and hardware alike).
#
#   idea -> spec -> design -> build -> test -> release | integrate
#
# Every step is a graph: an idea and a spec are documents with frontmatter, the design is an `*.arch.yaml` (components and the edges between them;
# `graf util arch2mmd` draws it, `graf util arch-drift` checks it against the code), build artifacts are the code or the parts list (BOM), and so on.
# This pack is the prototype of that discipline inside work-graph: it tags what exists at each step and reports the steps that were skipped.
area: design
label: Graphware design lifecycle (idea to release)

stages:
  - {id: idea,      label: Idea,      next: [spec]}
  - {id: spec,      label: Spec,      next: [design]}
  - {id: design,    label: Design,    next: [build]}
  - {id: build,     label: Build,     next: [test]}
  - {id: test,      label: Test,      next: [release, integrate]}
  - {id: release,   label: Release,   next: [idea]}      # feedback loop: what shipped breeds the next idea
  - {id: integrate, label: Integrate, next: [idea]}      # ... or the product becomes a part of a larger one

# Legal relations between artifacts of different stages. Also the vocabulary for frontmatter keys (`refines: [IDEA-1]`) and code annotations
# (`# implements: work-graph`, where the id is a component of an `*.arch.yaml`).
flow_relations:
  - {from: spec,      to: idea,   relation: refines}
  - {from: design,    to: spec,   relation: satisfies}
  - {from: build,     to: design, relation: implements}
  - {from: test,      to: spec,   relation: verifies}
  - {from: test,      to: design, relation: verifies}
  - {from: test,      to: build,  relation: verifies}
  - {from: release,   to: build,  relation: ships}
  - {from: integrate, to: build,  relation: integrates}
  - {from: idea,      to: release, relation: motivated_by}

# "Every <stage> artifact (of these kinds) needs an in/out edge of this relation."
expectations:
  - {stage: idea,   kinds: [idea],         needs: refines,    direction: in, message: "idea has no spec"}
  - {stage: spec,   kinds: [spec],         needs: satisfies,  direction: in, message: "spec has no design"}
  - {stage: spec,   kinds: [spec],         needs: verifies,   direction: in, message: "spec has no test"}
  - {stage: design, kinds: [component],    needs: implements, direction: in, message: "component has no build artifact (add `# implements: <component id>` in its code)"}
  - {stage: design, kinds: [component],    needs: verifies,   direction: in, message: "component has no test"}

classifiers:
  - {stage: idea,      globs: ["**/ideas/**", "**/*idea*.md", "**/*vision*.md", "**/*brainstorm*.md"]}
  - {stage: spec,      globs: ["**/specs/**", "**/spec*.md", "**/requirements/**", "**/user-stories/**", "**/*roadmap*.md", "**/*todo*.md"]}
  - {stage: design,    globs: ["**/*.arch.yaml", "**/adr/**", "**/decisions/**", "**/design/**", "**/architecture/**", "**/design*.md", "**/*-design*.md", "**/claude.md"]}
  - {stage: test,      globs: ["**/tests/**", "**/test/**", "**/test_*", "**/*_test.go", "**/*.spec.*"]}
  - {stage: release,   globs: ["**/CHANGELOG*", "**/.github/workflows/**", "**/Dockerfile*", "**/release/**"]}
  - {stage: integrate, globs: ["**/integration/**", "**/integrate/**", "**/interfaces/**"]}
  - {stage: build,     default: true}

ignore: ["**/docs/archive/**", "**/docs/images/**", "**/logs/**", "**/logs-*/**", "**/*.log", "**/*.pyc", "**/*.db", "**/*.lock", "**/package-lock.json"]

processors:
  - {name: claude-memory, use: claude_memory}
  - {name: code,          use: ast}
  - {name: docs,          use: frontmatter, match: ["**/*.md"]}
  - {name: annotations,   use: annotations, match: ["**/*.py", "**/*.js", "**/*.ts", "**/*.go", "**/*.sql", "**/*.sh"]}
  - {name: architecture,  use: arch,        match: ["**/*.arch.yaml"]}      # components and the edges between them
  - {name: graflang,      use: graflang,    match: ["**/*.graph.yaml", "**/*.bind.yaml", "**/graflang.errors.yaml"]}
